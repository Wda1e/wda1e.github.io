    <style>
      :root {
        --paper: #efe8dd;
        --ink: #1d1814;
        --red: #d6262e;
        --blue: #1b5c8c;
        --amber: #f0b83f;
        --glow: 0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Space Mono", monospace;
        color: var(--ink);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Frame chrome: laser-bed registration marks + meta labels. */
      .chrome {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .mark {
        position: absolute;
        width: 44px;
        height: 44px;
      }
      .mark::before,
      .mark::after {
        content: "";
        position: absolute;
        background: var(--ink);
      }
      .mark::before {
        left: 0;
        right: 0;
        top: 21px;
        height: 2px;
      }
      .mark::after {
        top: 0;
        bottom: 0;
        left: 21px;
        width: 2px;
      }
      .mark.tl { left: 48px; top: 48px; }
      .mark.tr { right: 48px; top: 48px; }
      .mark.bl { left: 48px; bottom: 48px; }
      .mark.br { right: 48px; bottom: 48px; }
      .meta {
        position: absolute;
        top: 58px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .meta.left { left: 120px; display: flex; align-items: center; gap: 14px; }
      .meta.right { right: 120px; }
      .dot {
        display: block;
        width: 14px;
        height: 14px;
        background: var(--red);
      }

      /* Scene type: left column, vertically centred. */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: 120px;
        gap: 26px;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .label::before {
        content: "";
        display: block;
        width: 36px;
        height: 4px;
        background: var(--red);
      }
      .headline {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 150px;
        line-height: 0.92;
        letter-spacing: -0.035em;
        max-width: 860px;
      }
      .headline.md { font-size: 128px; }
      .accent { color: var(--red); }
      .count {
        display: inline-block;
        min-width: 2.2em;
        text-align: left;
      }
      .rule {
        display: block;
        width: 240px;
        height: 10px;
        background: var(--red);
        transform-origin: left center;
        box-shadow: 0 0 calc(4px + var(--glow) * 18px) rgba(214, 38, 46, calc(0.2 + var(--glow) * 0.45));
      }
      .readout {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .readout b { color: var(--red); font-weight: 700; }
      .stack { display: flex; flex-direction: column; gap: 10px; }
      .wordmark {
        font-family: "Archivo Black", sans-serif;
        font-size: 136px;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      .tagline {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .url {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding-bottom: 8px;
        border-bottom: 6px solid var(--red);
      }

    <script>const D = 20.5;
      const tl = gsap.timeline({ paused: true });
      const slam = (sel, at, from = {}) =>
        tl.fromTo(sel, { opacity: 0, scale: 1.18, y: 24, ...from }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "expo.out", transformOrigin: "0% 60%" }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, y: -26, duration: 0.24, ease: "power2.in" }, at);
      const ruleIn = (sel, at) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at);
      const labelIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, at);

      // Chrome: in with the first frames, registration marks breathe slowly.
      tl.fromTo(".mark", { opacity: 0, scale: 0.6 }, { opacity: 0.85, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.06 }, 0.05);
      tl.fromTo(".meta", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.08 }, 0.15);
      tl.to(".mark", { rotation: 90, duration: D - 0.6, ease: "none" }, 0.55);

      // Scene 1 — the count IS the headline: 001 → 154 as the pieces pop in (0.10–1.45s).
      slam("#s1-head", 0.1);
      labelIn("#s1-label", 0.3);
      ruleIn("#s1-rule", 0.45);
      const pieces = { n: 1 };
      const countEl = document.getElementById("s1-count");
      tl.to(pieces, { n: 154, duration: 1.35, ease: "none", onUpdate: () => (countEl.textContent = String(Math.round(pieces.n)).padStart(3, "0")) }, 0.1);
      tl.fromTo("#s1-count", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "100% 60%" }, 1.45);
      out(["#s1-label", "#s1-head", "#s1-rule"], 2.92);

      // Scene 2 — beat-grid: "10 layers." at 3.18s; readout ticks on each half-beat seat 3.70–6.06s.
      slam("#s2-head-a", 3.18);
      tl.fromTo("#s2-readout", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.3);
      ruleIn("#s2-rule", 3.35);
      const layerEl = document.getElementById("s2-layer");
      const seats = { n: 0 };
      tl.to(seats, {
        n: 10, duration: 2.3625, ease: "none",
        onUpdate: () => (layerEl.textContent = String(Math.min(10, Math.floor(seats.n + 1e-6))).padStart(2, "0")),
      }, 3.7 - 0.2625); // one tick per half-beat, landing on each seat
      out(["#s2-readout", "#s2-head-a", "#s2-rule"], 6.1);

      // beat-locked: 6.34s — "1 hero." payoff
      slam("#s2-head-b", 6.34, { scale: 1.35 });
      tl.fromTo("#s2b-readout", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.4);
      ruleIn("#s2b-rule", 6.4);

      // Scene 3 — beat-grid: 8.44s and 9.50s (every other beat, holding the reading floor)
      labelIn("#s3-label", 8.1);
      slam("#s3-a", 8.44);
      slam("#s3-b", 9.5, { x: -20 });
      out(["#s3-label", "#s3-a", "#s3-b"], 11.7);
