<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SparkStack — 154 pieces</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/audio-data.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/build/three.module.js",
          "three/addons/": "./assets/vendor/three/addons/"
        }
      }
    </script>
    <style>
      :root {
        --paper: #efe8dd;
        --ink: #1d1814;
        --red: #d6262e;
        --blue: #1b5c8c;
        --amber: #f0b83f;
        --glow: 0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Space Mono", monospace;
        color: var(--ink);
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Frame chrome: laser-bed registration marks + meta labels. */
      .chrome {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .mark {
        position: absolute;
        width: 44px;
        height: 44px;
      }
      .mark::before,
      .mark::after {
        content: "";
        position: absolute;
        background: var(--ink);
      }
      .mark::before {
        left: 0;
        right: 0;
        top: 21px;
        height: 2px;
      }
      .mark::after {
        top: 0;
        bottom: 0;
        left: 21px;
        width: 2px;
      }
      .mark.tl { left: 48px; top: 48px; }
      .mark.tr { right: 48px; top: 48px; }
      .mark.bl { left: 48px; bottom: 48px; }
      .mark.br { right: 48px; bottom: 48px; }
      .meta {
        position: absolute;
        top: 58px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .meta.left { left: 120px; display: flex; align-items: center; gap: 14px; }
      .meta.right { right: 120px; }
      .dot {
        display: block;
        width: 14px;
        height: 14px;
        background: var(--red);
      }

      /* Scene type: left column, vertically centred. */
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-left: 120px;
        gap: 26px;
      }
      .label {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .label::before {
        content: "";
        display: block;
        width: 36px;
        height: 4px;
        background: var(--red);
      }
      .headline {
        font-family: "Archivo Black", sans-serif;
        font-weight: 400;
        font-size: 150px;
        line-height: 0.92;
        letter-spacing: -0.035em;
        max-width: 860px;
      }
      .headline.md { font-size: 128px; }
      .accent { color: var(--red); }
      .count {
        display: inline-block;
        min-width: 2.2em;
        text-align: left;
      }
      .rule {
        display: block;
        width: 240px;
        height: 10px;
        background: var(--red);
        transform-origin: left center;
        box-shadow: 0 0 calc(4px + var(--glow) * 18px) rgba(214, 38, 46, calc(0.2 + var(--glow) * 0.45));
      }
      .readout {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .readout b { color: var(--red); font-weight: 700; }
      .stack { display: flex; flex-direction: column; gap: 10px; }
      .wordmark {
        font-family: "Archivo Black", sans-serif;
        font-size: 136px;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      .tagline {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .url {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding-bottom: 8px;
        border-bottom: 6px solid var(--red);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20.5"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>

      <div class="chrome">
        <i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i>
        <div class="meta left" id="meta-brand"><span class="dot"></span>SparkStack</div>
        <div class="meta right" id="meta-design">Design 0018</div>
      </div>

      <!-- Scene 1 — Hook: the headline counts the pieces as they pop in -->
      <section id="s1" class="scene clip" data-start="0" data-duration="3.18" data-track-index="1">
        <div class="label" id="s1-label">Laser-cut acrylic</div>
        <h1 class="headline" id="s1-head"><span class="accent count" id="s1-count">001</span> pieces.</h1>
        <span class="rule" id="s1-rule"></span>
      </section>

      <!-- Scene 2 — Reveal: ten layers seat, then the payoff -->
      <section id="s2" class="scene clip" data-start="3.18" data-duration="4.74" data-track-index="1">
        <div class="readout" id="s2-readout">LAYER <b id="s2-layer">00</b>/10</div>
        <div class="stack" style="position: relative">
          <h1 class="headline" id="s2-head-a"><span class="accent">10</span> layers.</h1>
        </div>
        <span class="rule" id="s2-rule"></span>
      </section>
      <section id="s2b" class="scene clip" data-start="6.34" data-duration="1.58" data-track-index="2">
        <div class="readout" id="s2b-readout">LAYER <b>10</b>/10</div>
        <h1 class="headline" id="s2-head-b"><span class="accent">1</span> hero.</h1>
        <span class="rule" id="s2b-rule"></span>
      </section>

      <!-- Scene 3 — Depth -->
      <section id="s3" class="scene clip" data-start="7.92" data-duration="4.2" data-track-index="1">
        <div class="label" id="s3-label">10 layers · 54 standoffs</div>
        <div class="stack">
          <h1 class="headline" id="s3-a">Real depth.</h1>
          <h1 class="headline accent" id="s3-b">Not a print.</h1>
        </div>
      </section>

      <!-- Scene 4 — On the wall -->
      <section id="s4" class="scene clip" data-start="12.12" data-duration="4.22" data-track-index="1">
        <div class="label" id="s4-label">3D acrylic wall art</div>
        <h1 class="headline md" id="s4-head">Made for <span class="accent">your wall.</span></h1>
        <span class="rule" id="s4-rule"></span>
      </section>

      <!-- Scene 5 — Outro lockup -->
      <section id="s5" class="scene clip" data-start="16.34" data-duration="4.16" data-track-index="1">
        <div class="wordmark" id="s5-word">Spark<span class="accent">Stack</span></div>
        <div class="tagline" id="s5-tag">Art that stacks up.</div>
        <div class="url" id="s5-url">sparkstack.com</div>
      </section>

      <!-- Audio: music bed + motion-matched SFX (brag bundled, CC0 SFX) -->
      <audio
        id="bg-music"
        src="assets/music/happy-beats-business-moves-vol-9-by-ende-dot-app.mp3"
        data-start="0"
        data-duration="20.5"
        data-track-index="10"
        data-volume="0.35"
        data-timeline-role="music"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":1},{"t":19.4,"v":1},{"t":20.5,"v":0}]}]}'
      ></audio>
      <audio id="sfx-hook" src="assets/sfx/impact/impactSoft_medium_001.ogg" data-start="0.08" data-duration="0.18" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-layer-first" src="assets/sfx/casino/chip-lay-1.ogg" data-start="3.68" data-duration="0.17" data-track-index="12" data-volume="0.55"></audio>
      <audio id="sfx-layer-last" src="assets/sfx/casino/chip-lay-2.ogg" data-start="6.04" data-duration="0.23" data-track-index="13" data-volume="0.55"></audio>
      <audio id="sfx-hero" src="assets/sfx/impact/impactBell_heavy_000.ogg" data-start="6.32" data-duration="1.5" data-track-index="14" data-volume="0.55"></audio>
      <audio id="sfx-room" src="assets/sfx/impact/impactSoft_medium_002.ogg" data-start="12.62" data-duration="0.14" data-track-index="15" data-volume="0.55"></audio>
      <audio id="sfx-lockup" src="assets/sfx/interface/bong_001.ogg" data-start="16.32" data-duration="0.12" data-track-index="16" data-volume="0.6"></audio>
    </div>

    <script>
      const D = 20.5;
      const tl = gsap.timeline({ paused: true });
      const slam = (sel, at, from = {}) =>
        tl.fromTo(sel, { opacity: 0, scale: 1.18, y: 24, ...from }, { opacity: 1, scale: 1, y: 0, duration: 0.34, ease: "expo.out", transformOrigin: "0% 60%" }, at);
      const out = (sel, at) => tl.to(sel, { opacity: 0, y: -26, duration: 0.24, ease: "power2.in" }, at);
      const ruleIn = (sel, at) => tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at);
      const labelIn = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, at);

      // Chrome: in with the first frames, registration marks breathe slowly.
      tl.fromTo(".mark", { opacity: 0, scale: 0.6 }, { opacity: 0.85, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.06 }, 0.05);
      tl.fromTo(".meta", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.08 }, 0.15);
      tl.to(".mark", { rotation: 90, duration: D - 0.6, ease: "none" }, 0.55);

      // Scene 1 — the count IS the headline: 001 → 154 as the pieces pop in (0.10–1.45s).
      slam("#s1-head", 0.1);
      labelIn("#s1-label", 0.3);
      ruleIn("#s1-rule", 0.45);
      const pieces = { n: 1 };
      const countEl = document.getElementById("s1-count");
      tl.to(pieces, { n: 154, duration: 1.35, ease: "none", onUpdate: () => (countEl.textContent = String(Math.round(pieces.n)).padStart(3, "0")) }, 0.1);
      tl.fromTo("#s1-count", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "100% 60%" }, 1.45);
      out(["#s1-label", "#s1-head", "#s1-rule"], 2.92);

      // Scene 2 — beat-grid: "10 layers." at 3.18s; readout ticks on each half-beat seat 3.70–6.06s.
      slam("#s2-head-a", 3.18);
      tl.fromTo("#s2-readout", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 3.3);
      ruleIn("#s2-rule", 3.35);
      const layerEl = document.getElementById("s2-layer");
      const seats = { n: 0 };
      tl.to(seats, {
        n: 10, duration: 2.3625, ease: "none",
        onUpdate: () => (layerEl.textContent = String(Math.min(10, Math.floor(seats.n + 1e-6))).padStart(2, "0")),
      }, 3.7 - 0.2625); // one tick per half-beat, landing on each seat
      out(["#s2-readout", "#s2-head-a", "#s2-rule"], 6.1);

      // beat-locked: 6.34s — "1 hero." payoff
      slam("#s2-head-b", 6.34, { scale: 1.35 });
      tl.fromTo("#s2b-readout", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.4);
      ruleIn("#s2b-rule", 6.4);

      // Scene 3 — beat-grid: 8.44s and 9.50s (every other beat, holding the reading floor)
      labelIn("#s3-label", 8.1);
      slam("#s3-a", 8.44);
      slam("#s3-b", 9.5, { x: -20 });
      out(["#s3-label", "#s3-a", "#s3-b"], 11.7);

      // Scene 4 — beat-locked: 12.65s room reveal line
      labelIn("#s4-label", 12.5);
      slam("#s4-head", 12.65);
      ruleIn("#s4-rule", 12.8);
      out(["#s4-label", "#s4-head", "#s4-rule"], 16.02);

      // Scene 5 — beat-grid lockup: 16.34 / 16.86 / 17.38s
      slam("#s5-word", 16.34);
      tl.fromTo("#s5-tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.86);
      tl.fromTo("#s5-url", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 17.38);

      // Audio-reactive (subtle): music bass/RMS drives the red rules' glow.
      const A = window.AUDIO_DATA;
      const rootEl = document.getElementById("root");
      const drive = { t: 0 };
      tl.to(drive, {
        t: D, duration: D, ease: "none",
        onUpdate: () => {
          const f = Math.min(A.totalFrames - 1, Math.max(0, Math.round(drive.t * A.fps)));
          const fr = A.frames[f];
          rootEl.style.setProperty("--glow", (fr.bands[0] * 0.7 + fr.rms * 0.3).toFixed(3));
        },
      }, 0);

      window.__timelines["main"] = tl;
    </script>
    <script type="module" src="stage.js"></script>
  </body>
</html>
